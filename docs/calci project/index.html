<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: gray;
        }

        .heading {
            text-align: center;
            color: brown;
            border: 5px solid black;
        }

        .display {
            height: 100px;
            width: 720px;
            background-color: rgb(42, 73, 42);
            border-top: 10px solid;
            border-left: 10px solid;
            border-right: 10px solid;
            font-size: 70pt;
            text-align: right;
            padding: 20px;
        }

        .con1 {
            display: flex;
            justify-content: center;
        }

        .con2 {
            width: 740px;
            height: 600px;
            border: 10px solid;
            display: grid;
            grid-template-columns: 3fr 3fr 3fr 3fr 3fr;
            gap: 10px;
            padding: 10px;
        }

        .switchcen {
            display: flex;
            justify-content: center;
        }

        .switch {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(54, 52, 52);
            border-radius: 50%;
            text-align: center;
        }
        .switch>.bu
        {
            background-color: black;
            color: white;
            font-weight: bold;
            font-size: 22pt;
            border: none;
            height: 100px;
            width: 100px;
            border-radius: 50%;
        }
        .clear
        {
            display: flex;
            justify-content: center;
            height: 50px;
            border-radius: 10%;
        }
        .clear>button
        {
            background-color: black;
            color: white;
            font-weight: bold;
            border: 5px solid ;
             
        }
    </style>
</head>
<body>
    <h1 class="heading">Welcome</h1>
    <div class="con1">
        <div class="display">0</div>
    </div>
    <div class="switchcen">
        <div class="con2">
            <div class="switch">
                <button type="button" class="bu">1</button>
            </div>
            <div class="switch"><button type="button" class="bu">2</button></div>
            <div class="switch"><button type="button" class="bu">3</button></div>
            <div class="switch"><button type="button" class="bu">4</button></div>
            <div class="switch"><button type="button" class="bu">+</button></div>
            <div class="switch"><button type="button" class="bu">5</button></div>
            <div class="switch"><button type="button" class="bu">6</button></div>
            <div class="switch"><button type="button" class="bu">7</button></div>
            <div class="switch"><button type="button" class="bu">8</button></div>
            <div class="switch">
                <div class="switch"><button type="button" class="bu">-</button></div>

            </div>
            <div class="switch">
                <div class="switch"><button type="button" class="bu">9</button></div>

            </div>
            <div class="switch">
                <div class="switch"><button type="button" class="bu">0</button></div>

            </div>
            <div class="switch">
                <div class="switch"><button type="button" class="bu">*</button></div>

            </div>
            <div class="switch">
                <div class="switch"><button type="button" class="bu">/</button></div>

            </div>
            <div class="switch">
                <div class="switch"><button type="button" class="bu">=</button></div>

            </div>
        </div>
    </div>
