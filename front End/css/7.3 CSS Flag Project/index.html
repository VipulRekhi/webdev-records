<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    .flag
    {
      height: 600px;
      width: 900px;
      background-color: red;
    }
    .flag>div
    {
      background-color:rgb(69, 19, 184) ;
      position: relative;
      top: 10%;
      height: 300px;
      width: 100%;
    }
    .flag>p
    {
      text-align: center;
      font-size: 4rem;
      color: white;
    }
    div>div>div
    {
      background-color: white;
      border-radius: 50%;
      height: 200px;
      width: 200px;
      position: absolute;
      left:37%;
      top: 17%;
      text-align: center;
    }
    p
    {
      text-align: center;
      margin: 0;
      font-size: 5rem;
    }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
